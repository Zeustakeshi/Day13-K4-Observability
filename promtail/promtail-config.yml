server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: day13-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: day13-logs
          __path__: /var/log/app_data/logs.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            event: event
            latency_ms: latency_ms
            cost_usd: cost_usd
            tokens_in: tokens_in
            tokens_out: tokens_out
            quality_score: quality_score
            error_type: error_type
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
